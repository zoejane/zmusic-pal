name: Check static music

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node docs/verify.cjs
      - name: Pages files exist
        run: |
          test -f docs/index.html
          test -f docs/music.js
          test -f docs/app.js
          test -f docs/styles.css
          test -f docs/CNAME
          grep -q 'zmusic-pal.zoejane.net' docs/CNAME
