<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zMusic-Pal: 小巧优雅的音乐工具</title>
    <meta name="description" content="查调和查和弦：纯静态页面，在浏览器里计算音阶与和弦。" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <h1>zMusic-Pal</h1>
        <p class="tag" lang="zh-CN">音乐伙伴</p>
      </div>
      <div class="header-actions">
        <a class="icon-btn" href="https://www.zoejane.net" target="_blank" rel="noopener noreferrer" aria-label="About ZoeJane" title="About">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <a class="icon-btn" href="https://github.com/zoejane/zmusic-pal" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        </a>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
      </div>
    </header>

    <main>
      <section class="card" aria-labelledby="key-title">
        <h2 id="key-title">Key Finder | 查调</h2>
        <div class="card-body">
          <div class="row">
            <label class="sr-only" for="key-root">Root note</label>
            <select id="key-root" aria-label="Root Note | 选择音名"></select>
            <label class="sr-only" for="key-scale">Scale</label>
            <select id="key-scale" aria-label="Scale Type | 选择调式"></select>
          </div>
          <div class="panel">
            <h3>Scale | 音阶</h3>
            <div id="scale-out"></div>
          </div>
          <div class="panel">
            <h3>Common Chords | 常用和弦</h3>
            <div class="chords" id="chords-out"></div>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="chord-title">
        <h2 id="chord-title">Chord Finder | 查和弦</h2>
        <div class="card-body">
          <div class="row">
            <label class="sr-only" for="chord-root">Root note</label>
            <select id="chord-root" aria-label="Root Note | 选择根音"></select>
            <label class="sr-only" for="chord-type">Chord type</label>
            <select id="chord-type" aria-label="Chord Type | 选择和弦类型"></select>
          </div>
          <div class="panel">
            <p class="chord-notes">Notes | 组成音：<strong id="chord-notes"></strong></p>
          </div>
        </div>
      </section>

      <p class="note">AI Pal is not on this static version. | 静态版不含 AI 伙伴。</p>
    </main>

    <style>
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script src="music.js"></script>
    <script src="app.js"></script>
  </body>
</html>
